<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ops · Thindesk</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/temas/{t}.css(t=${@environment.getProperty('app.tema','padrao')})}">
    <link rel="stylesheet" th:href="@{/css/componentes.css}">
</head>
<body style="display:grid;place-items:center;min-height:100vh;padding:1.5rem">
<div class="cartao text-center" style="max-width:460px">
    <div class="kpi-icone amarelo mx-auto mb-3"><i class="bi bi-cone-striped"></i></div>
    <h2 style="font-size:1.3rem;font-weight:700">Não foi possível concluir a operação</h2>
    <p style="color:var(--cor-texto-fraco);font-size:.9rem">
        Volte para o painel e tente novamente em alguns instantes.
    </p>
    <a th:href="@{/dashboard}" class="botao botao-primario">Voltar ao dashboard</a>
</div>
</body>
</html>
