<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<aside th:fragment="menu" class="barra-lateral">
    <a class="marca" th:href="@{/dashboard}">
        <img th:src="@{/images/logo.svg}" alt="Thindesk">
        <span>
            <strong>Thindesk</strong>
            <small>Service Desk</small>
        </span>
    </a>

    <div class="menu-secao">Atendimento</div>
    <ul class="menu">
        <li>
            <a th:href="@{/dashboard}"
               th:classappend="${rota == '/dashboard'} ? 'ativo'">
                <i class="bi bi-grid-1x2"></i> Dashboard
            </a>
        </li>
        <li>
            <a th:href="@{/chamados}"
               th:classappend="${#strings.startsWith(rota, '/chamados')} ? 'ativo'">
                <i class="bi bi-headset"></i> Chamados
            </a>
        </li>
        <li>
            <a th:href="@{/clientes}"
               th:classappend="${#strings.startsWith(rota, '/clientes')} ? 'ativo'">
                <i class="bi bi-people"></i> Clientes
            </a>
        </li>
        <li>
            <a th:href="@{/perfil}"
               th:classappend="${#strings.startsWith(rota, '/perfil')} ? 'ativo'">
                <i class="bi bi-person-badge"></i> Meu perfil
            </a>
        </li>
    </ul>

    <div class="menu-secao" sec:authorize="hasAnyRole('GERENTE','ADMINISTRADOR')">Gestão</div>
    <ul class="menu" sec:authorize="hasAnyRole('GERENTE','ADMINISTRADOR')">
        <li>
            <a th:href="@{/gerente/painel}"
               th:classappend="${#strings.startsWith(rota, '/gerente')} ? 'ativo'">
                <i class="bi bi-briefcase"></i> Painel do gerente
            </a>
        </li>
        <li>
            <a th:href="@{/ajustes-horarios}"
               th:classappend="${#strings.startsWith(rota, '/ajustes-horarios')} ? 'ativo'">
                <i class="bi bi-clock-history"></i> Horários
            </a>
        </li>
        <li sec:authorize="hasRole('ADMINISTRADOR')">
            <a th:href="@{/administrador/painel}"
               th:classappend="${#strings.startsWith(rota, '/administrador')} ? 'ativo'">
                <i class="bi bi-shield-lock"></i> Administração
            </a>
        </li>
    </ul>

    <div class="menu-rodape">
        <i class="bi bi-circle-fill" style="font-size:.45rem;color:#22c55e"></i>
        Ambiente operacional
        <div class="mt-1" th:text="'Versão ' + ${@environment.getProperty('app.versao','1.0.0')}">Versão 1.0.0</div>
    </div>
</aside>
</body>
</html>
