<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$CONTENT_TITLE · $LAYOUT_TITLE">Thindesk</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/temas/{t}.css(t=${@environment.getProperty('app.tema','padrao')})}">
    <link rel="stylesheet" th:href="@{/css/principal.css}">
    <link rel="stylesheet" th:href="@{/css/componentes.css}">
    <link rel="stylesheet" th:href="@{/css/painel.css}">
    <th:block layout:fragment="estilos"></th:block>
</head>
<body>
<aside class="barra-lateral" th:replace="~{fragmentos/menu :: menu}"></aside>

<div class="area-principal">
    <div th:replace="~{fragmentos/cabecalho :: cabecalho}"></div>

    <main class="conteudo">
        <div th:replace="~{fragmentos/mensagens :: mensagens}"></div>
        <div layout:fragment="conteudo"></div>
    </main>

    <div th:replace="~{fragmentos/rodape :: rodape}"></div>
</div>

<script th:src="@{/js/script.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<th:block layout:fragment="scripts"></th:block>
</body>
</html>
