spring.application.name=Thindesk

server.port=${PORT:8080}
server.error.whitelabel.enabled=false

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/thindesk}
spring.data.mongodb.database=${MONGODB_DATABASE:thindesk}
spring.data.mongodb.auto-index-creation=true

spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.messages.encoding=UTF-8

spring.web.resources.cache.cachecontrol.max-age=365d

app.tema=${APP_TEMA:padrao}
app.versao=${APP_VERSAO:1.0.0}
app.semente.dados=${APP_SEMENTE_DADOS:true}

logging.level.root=INFO
logging.level.org.springframework.data.mongodb.core.MongoTemplate=WARN
