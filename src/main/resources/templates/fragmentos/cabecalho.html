<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="cabecalho" class="barra-topo">
    <button type="button" class="botao-menu" data-menu aria-label="Abrir menu">
        <i class="bi bi-list"></i>
    </button>

    <div>
        <h1>
            <span th:text="${tituloPagina} ?: 'Thindesk'">Thindesk</span>
            <span class="subtitulo" th:text="${subtituloPagina} ?: 'Central de atendimento técnico'">Central de atendimento técnico</span>
        </h1>
    </div>

    <div class="usuario-topo">
        <div class="avatar" th:text="${#strings.substring(#authentication.name, 0, 2).toUpperCase()}">TD</div>
        <div class="dados">
            <div class="nome" sec:authentication="name">usuario@thindesk.com</div>
            <div class="perfil" sec:authentication="authorities">ROLE_USUARIO</div>
        </div>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="botao botao-claro botao-pequeno" title="Encerrar sessão">
                <i class="bi bi-box-arrow-right"></i>
                <span class="d-none d-md-inline">Sair</span>
            </button>
        </form>
    </div>
</header>
</body>
</html>
